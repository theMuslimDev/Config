# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
# git clone -b v2.1.1 https://github.com/catppuccin/tmux.git ~/.config/tmux/plugins/catppuccin/tmux
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# git clone https://github.com/tmux-plugins/tmux-cpu ~/.config/tmux/plugins/
run ~/.config/tmux/plugins/tmux-cpu/cpu.tmux

# git clone https://github.com/tmux-plugins/tmux-battery ~/.config/tmux/plugins/
run ~/.config/tmux/plugins/tmux-battery/battery.tmux

# git clone ttps://github.com/tmux-plugins/tmux-resurrect ~/.config/tmux/plugins/
run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
